<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Almeydas - Panel de Administración</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>Panel de Administración</h1>
        <div class="user-info">
            <span class="welcome-message" id="welcomeMessage"></span>
            <button id="logoutButton">Cerrar Sesión</button>
        </div>
    </header>

    <div class="container">
        <h2>Registrar Nuevo Producto</h2>

        <div class="form-section">
            <form id="productForm">
                <input type="text" id="referencia" placeholder="Referencia" required>
                <input type="text" id="nombre" placeholder="Nombre del Producto" required>
                <textarea id="descripcion" placeholder="Descripción (opcional)"></textarea>
                <input type="number" id="precio" placeholder="Precio" step="0.01" required>
                <input type="number" id="cantidad" placeholder="Cantidad" required>
                <button type="submit">Registrar Producto</button>
                <p id="productMessage" class="message"></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
