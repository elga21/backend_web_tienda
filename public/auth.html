<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los ALMEYDAS - Acceso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Los ALMEYDAS</h1>
        <nav>
            <ul>
                <li><a href="/">Productos</a></li>
                <li><a href="/auth.html">Registro/Login</a></li>
                <li><a href="/dashboard.html">Dashboard Admin</a></li>
                <li>
                    <a href="/cart.html">
                        Carrito (<span id="cart-count">0</span>)
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="auth-container">
        <section id="register-section">
            <h2>Registrarse</h2>
            <form id="register-form">
                <label for="reg-nombre">Nombre:</label>
                <input type="text" id="reg-nombre" name="nombre" required>

                <label for="reg-correo">Correo Electrónico:</label>
                <input type="email" id="reg-correo" name="correo" required>

                <label for="reg-contrasena">Contraseña:</label>
                <input type="password" id="reg-contrasena" name="contraseña" required>

                <label for="reg-rol">Rol (opcional, por defecto 'cliente'):</label>
                <select id="reg-rol" name="rol">
                    <option value="cliente">Cliente</option>
                    <option value="admin">Administrador</option>
                </select>

                <button type="submit">Registrar</button>
            </form>
            <p id="register-message"></p>
            <p>¿Ya tienes una cuenta? <a href="#" id="show-login">Inicia sesión aquí</a></p>
        </section>

        <section id="login-section" style="display: none;">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <label for="login-correo">Correo Electrónico:</label>
                <input type="email" id="login-correo" name="correo" required>

                <label for="login-contrasena">Contraseña:</label>
                <input type="password" id="login-contrasena" name="contraseña" required>

                <button type="submit">Iniciar Sesión</button>
            </form>
            <p id="login-message"></p>
            <p>¿No tienes una cuenta? <a href="#" id="show-register">Regístrate aquí</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Los ALMEYDAS. Todos los derechos reservados.</p>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="js/cart.js"></script> </body>
</html>
